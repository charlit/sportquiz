# Toutes les 6 heures, met à jour matchs.json (grosses affiches des 8 prochains jours) pour le quiz d'avant-match.
# La clé football-data.org (gratuite) est le secret FOOTBALL_DATA_KEY du dépôt.
name: Calendrier des matchs
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  matchs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/matchs.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchs.json
          git diff --cached --quiet || { git commit -m "chore: calendrier des matchs" && git push; }
